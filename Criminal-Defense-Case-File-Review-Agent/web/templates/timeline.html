<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>卷宗时间线 - {{ case_name }}</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Microsoft YaHei", sans-serif; padding: 20px 40px; max-width: 900px; }
  #top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  #top-bar a { color: #2255AA; text-decoration: none; font-size: 14px; }
  #top-bar a:hover { text-decoration: underline; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  #note-line { font-size: 13px; color: #666; margin-bottom: 20px; }
  #content {
    white-space: pre-wrap; word-wrap: break-word; font-size: 14px; line-height: 1.7;
  }
  #empty { color: #999; padding: 40px; text-align: center; }
</style>
</head>
<body>

<div id="top-bar">
  <h1>{{ case_name }} —— 卷宗时间线</h1>
  <a href="/case/{{ case_name }}">&larr; 返回深挖对话</a>
</div>
<div id="note-line">只摘录卷宗里明确写出的具体日期,不推断模糊时间;同一天不同材料记载不一样甚至矛盾的,原样并列列出,不做取舍——判断权在律师,这不是一份叙事,是同一批已核实事实换了个按时间排的视角。</div>

{% if timeline_text %}
<div id="content">{{ timeline_text }}</div>
{% else %}
<div id="empty">这个案子还没有生成时间线(可能是改动之前跑的老案子)。</div>
{% endif %}

</body>
</html>
