<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>处理中 - {{ case_name }}</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Microsoft YaHei", sans-serif; padding: 60px 40px; max-width: 600px; }
  h1 { font-size: 18px; margin-bottom: 20px; }
  #back { font-size: 13px; margin-bottom: 20px; }
  #back a { color: #666; text-decoration: none; }

  #status-box { border: 1px solid #ddd; border-radius: 8px; padding: 24px; }
  #status-text { font-size: 15px; margin-bottom: 10px; }
  #detail { font-size: 13px; color: #888; }
  #hint { font-size: 12px; color: #999; margin-top: 16px; }
  #open-link {
    display: inline-block; margin-top: 16px; padding: 8px 18px; background: #2255AA; color: #fff;
    text-decoration: none; border-radius: 6px; font-size: 13px;
  }
  .spinner {
    display: inline-block; width: 12px; height: 12px; border: 2px solid #ccc; border-top-color: #2255AA;
    border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 8px; vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="back"><a href="/">&larr; 返回案子列表</a></div>
<h1>{{ case_name }}</h1>

<div id="status-box">
  <div id="status-text"><span class="spinner"></span>正在处理...</div>
  <div id="detail"></div>
</div>
<div id="hint">摄取(视觉识别转录)+ 分析全部跑完才算完成,案子大的话可能要跑十几分钟,这个页面可以放着不用管,跑完了会自动更新。</div>

<script>
const CASE_NAME = {{ case_name|tojson }};
const statusText = document.getElementById('status-text');
const detail = document.getElementById('detail');
const statusBox = document.getElementById('status-box');

async function poll() {
  try {
    const resp = await fetch('/api/case-status/' + encodeURIComponent(CASE_NAME));
    const data = await resp.json();

    if (data.status === 'done') {
      statusText.innerHTML = '处理完成';
      detail.innerHTML = `<a id="open-link" href="/case/${encodeURIComponent(CASE_NAME)}">打开这个案子</a>`;
      return; // 停止轮询
    } else if (data.status === 'error') {
      statusText.textContent = '处理失败';
      detail.textContent = data.error || '未知错误';
      return; // 停止轮询
    } else if (data.status === 'running') {
      statusText.innerHTML = '<span class="spinner"></span>' + (data.phase || '正在处理...');
      // 不是精确进度百分比(算不准,做一个假的反而误导),这里给的是"当前阶段还在动吗"——
      // 这个数字如果一直很小(每次轮询都重置),说明系统在正常往前推进;如果这个数字自己
      // 涨到远超"跑了多久"本身,才是阶段卡住的信号,不是单纯"案子大所以慢"。
      detail.textContent = `已经跑了 ${data.elapsed_seconds} 秒 · 当前阶段持续了 ${data.seconds_since_phase_update ?? '?'} 秒`;
    } else {
      statusText.textContent = '找不到处理记录';
      detail.textContent = data.error || '';
      return;
    }
  } catch (err) {
    detail.textContent = '查询状态失败,继续重试: ' + err;
  }
  setTimeout(poll, 3000);
}

poll();
</script>

</body>
</html>
