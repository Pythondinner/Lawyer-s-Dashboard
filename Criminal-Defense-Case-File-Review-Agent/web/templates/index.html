<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>阅卷 Agent - 深挖</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Microsoft YaHei", sans-serif; height: 100vh; display: flex; }

  #report-pane {
    width: 45%;
    border-right: 1px solid #ccc;
    overflow-y: auto;
    padding: 20px;
    background: #fafafa;
  }
  #report-pane h2 { margin-top: 0; }
  #home-link { font-size: 13px; margin-bottom: 10px; }
  #home-link a { color: #666; text-decoration: none; }
  #home-link a:hover { text-decoration: underline; }
  #timeline-link { font-size: 13px; margin-bottom: 8px; }
  #timeline-link a { color: #2255AA; text-decoration: none; }
  #timeline-link a:hover { text-decoration: underline; }
  #indictment-links { font-size: 13px; margin-bottom: 12px; }
  #indictment-links a { color: #2255AA; text-decoration: none; display: block; margin-bottom: 4px; }
  #indictment-links a:hover { text-decoration: underline; }
  #candidates-banner {
    display: none; font-size: 13px; margin-bottom: 12px; padding: 8px 12px;
    background: #fffbee; border: 1px solid #e0c060; border-radius: 6px;
  }
  #candidates-banner a { color: #a06a00; text-decoration: none; font-weight: bold; }
  #candidates-banner a:hover { text-decoration: underline; }
  #report-content {
    white-space: pre-wrap;
    word-wrap: break-word;
    font-size: 14px;
    line-height: 1.6;
  }

  #chat-pane {
    width: 55%;
    display: flex;
    flex-direction: column;
  }
  #chat-header { padding: 15px 20px; border-bottom: 1px solid #ccc; }
  #chat-log {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
  }
  .msg { margin-bottom: 16px; max-width: 90%; }
  .msg-user { margin-left: auto; text-align: right; }
  .msg-bubble {
    display: inline-block;
    padding: 10px 14px;
    border-radius: 8px;
    white-space: pre-wrap;
    word-wrap: break-word;
    text-align: left;
    font-size: 14px;
    line-height: 1.6;
  }
  .msg-user .msg-bubble { background: #d2e8ff; }
  .msg-assistant .msg-bubble { background: #eee; }
  .msg-tool-event {
    font-size: 12px;
    color: #888;
    margin: 4px 0;
  }

  .proposal-card {
    border: 1px solid #e0c060;
    background: #fffbee;
    border-radius: 8px;
    padding: 10px 14px;
    margin: 8px 0;
    font-size: 13px;
    max-width: 90%;
  }
  .proposal-title { color: #333; margin-bottom: 4px; }
  .proposal-note { color: #777; font-size: 12px; margin-bottom: 8px; }
  .proposal-buttons button {
    font-size: 12px;
    padding: 4px 12px;
    margin-right: 8px;
    cursor: pointer;
  }
  .proposal-result { font-size: 12px; color: #2255AA; margin-top: 6px; }

  #chat-input-row {
    display: flex;
    padding: 15px;
    border-top: 1px solid #ccc;
  }
  #chat-input {
    flex: 1;
    padding: 10px;
    font-size: 14px;
    border: 1px solid #ccc;
    border-radius: 4px;
    resize: none;
  }
  #chat-send {
    margin-left: 10px;
    padding: 0 20px;
    font-size: 14px;
    cursor: pointer;
  }
  #chat-send:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>

<div id="report-pane">
  <div id="home-link"><a href="/">← 返回案子列表</a></div>
  <h2 id="case-name">加载中...</h2>
  <div id="timeline-link"><a href="/case/{{ case_name }}/timeline">→ 打开卷宗时间线</a></div>
  <div id="indictment-links"></div>
  <div id="candidates-banner"></div>
  <div id="report-content"></div>
</div>

<div id="chat-pane">
  <div id="chat-header"><strong>深挖对话</strong></div>
  <div id="chat-log"></div>
  <div id="chat-input-row">
    <textarea id="chat-input" rows="2" placeholder="输入问题,按 Enter 发送(Shift+Enter 换行)"></textarea>
    <button id="chat-send">发送</button>
  </div>
</div>

<script>
const CASE_NAME = {{ case_name|tojson }};
const API_BASE = '/case/' + encodeURIComponent(CASE_NAME);
const reportContent = document.getElementById('report-content');
const caseName = document.getElementById('case-name');
const chatLog = document.getElementById('chat-log');
const chatInput = document.getElementById('chat-input');
const chatSend = document.getElementById('chat-send');

function addMessage(role, text) {
  const wrap = document.createElement('div');
  wrap.className = 'msg msg-' + role;
  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.textContent = text;
  wrap.appendChild(bubble);
  chatLog.appendChild(wrap);
  chatLog.scrollTop = chatLog.scrollHeight;
}

function addToolEvents(events) {
  events.forEach(e => {
    const div = document.createElement('div');
    div.className = 'msg-tool-event';
    div.textContent = '· ' + e;
    chatLog.appendChild(div);
  });
  chatLog.scrollTop = chatLog.scrollHeight;
}

async function loadCase() {
  const resp = await fetch(API_BASE + '/api/case');
  const data = await resp.json();
  caseName.textContent = data.case_name;
  reportContent.textContent = data.report;

  const linksDiv = document.getElementById('indictment-links');
  data.indictments.forEach(ind => {
    const a = document.createElement('a');
    a.href = API_BASE + '/indictment/' + encodeURIComponent(ind.type);
    a.textContent = '→ 打开' + ind.type + '事实核对表' + (ind.healthy === false ? '(有异常,详见表内)' : '');
    linksDiv.appendChild(a);
  });

  if (data.indictment_candidates && data.indictment_candidates.length) {
    const banner = document.getElementById('candidates-banner');
    banner.style.display = 'block';
    banner.innerHTML = `发现 ${data.indictment_candidates.length} 处疑似起诉书/起诉意见书,` +
      `<a href="${API_BASE}/indictment-candidates">点此确认</a>`;
  }

  data.history.forEach(turn => addMessage(turn.role, turn.content));
}

let proposalCounter = 0;

function addProposalCards(proposals) {
  proposals.forEach(proposal => {
    const id = 'proposal-' + (proposalCounter++);
    const card = document.createElement('div');
    card.className = 'proposal-card';
    card.id = id;
    card.innerHTML = `
      <div class="proposal-title">【${proposal.volume} 第${proposal.page}页】${proposal.finding}</div>
      ${proposal.note ? `<div class="proposal-note">备注: ${proposal.note}</div>` : ''}
      <div class="proposal-buttons">
        <button onclick="respondProposal('${id}', 'confirmed')">确认</button>
        <button onclick="respondProposal('${id}', 'overturned')">推翻</button>
      </div>
    `;
    card.dataset.proposal = JSON.stringify(proposal);
    chatLog.appendChild(card);
  });
  chatLog.scrollTop = chatLog.scrollHeight;
}

async function respondProposal(cardId, status) {
  const card = document.getElementById(cardId);
  const proposal = JSON.parse(card.dataset.proposal);

  const resp = await fetch(API_BASE + '/api/chat/confirm-finding', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({proposal: proposal, status: status})
  });
  const data = await resp.json();

  const buttons = card.querySelector('.proposal-buttons');
  if (data.ok) {
    buttons.remove();
    const result = document.createElement('div');
    result.className = 'proposal-result';
    result.textContent = '已记录为:' + (status === 'confirmed' ? '确认' : '推翻');
    card.appendChild(result);
  } else {
    alert('保存失败: ' + (data.error || '未知错误'));
  }
}

async function sendMessage() {
  const text = chatInput.value.trim();
  if (!text) return;
  chatInput.value = '';
  chatSend.disabled = true;
  addMessage('user', text);

  try {
    const resp = await fetch(API_BASE + '/api/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: text})
    });
    const data = await resp.json();
    if (data.error) {
      addMessage('assistant', '[出错了] ' + data.error);
    } else {
      if (data.tool_events && data.tool_events.length) addToolEvents(data.tool_events);
      addMessage('assistant', data.reply);
      if (data.pending_proposals && data.pending_proposals.length) addProposalCards(data.pending_proposals);
    }
  } catch (err) {
    addMessage('assistant', '[网络错误,请重试] ' + err);
  } finally {
    chatSend.disabled = false;
    chatInput.focus();
  }
}

chatSend.addEventListener('click', sendMessage);
chatInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

loadCase();
</script>

</body>
</html>
